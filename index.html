<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perdóname 💙</title>

  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(180deg, #e3f2fd, #bbdefb);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 380px;
      padding: 25px 20px 35px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 120px;
    }

    #si {
      background: #2196f3;
      color: white;
      transition: transform 0.3s;
    }

    #no {
      background: #90caf9;
      color: #0d47a1;
    }

    #mensaje {
      margin-top: 18px;
      min-height: 26px;
      font-size: 16px;
      color: #1565c0;
      font-weight: bold;
    }

    /* Corazones */
    .heart {
      position: absolute;
      color: #2196f3;
      font-size: 20px;
      animation: flotar 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes flotar {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¿Me perdonas? 💙</h1>

    <div class="botones">
      <button id="si" onclick="aceptar()">Sí</button>
      <button id="no" onclick="rechazar()">No</button>
    </div>

    <div id="mensaje"></div>
  </div>

  <script>
    let tamaño = 1;
    let intentos = 0;

    const mensajes = [
      "¿Segura que no? 💙",
      "El sí se está esforzando 😅",
      "Mira lo grande que se hizo 🥺",
      "Ya casi ocupa toda la pantalla 😳",
      "El sí te ama 💙"
    ];

    function rechazar() {
      tamaño += 0.25;
      intentos++;

      const botonSi = document.getElementById("si");
      botonSi.style.transform = "scale(" + tamaño + ")";

      document.getElementById("mensaje").textContent =
        mensajes[Math.min(intentos - 1, mensajes.length - 1)];
    }

    function aceptar() {
      document.body.innerHTML = `
        <div style="
          background:linear-gradient(180deg,#2196f3,#1565c0);
          color:white;
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          text-align:center;
          font-family:Arial;
        ">
          <h1 style="padding:20px;">💙 Sabía que dirías que sí 💙</h1>
        </div>
      `;
    }

    /* Generar corazones */
    function crearCorazon() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💙";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 20) + "px";
      heart.style.animationDuration = (4 + Math.random() * 4) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }

    setInterval(crearCorazon, 500);
  </script>

</body>
</html>
