<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💙 Para ti</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #e3f2fd, #90caf9);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .card {
      background: white;
      width: 92%;
      max-width: 380px;
      padding: 30px 22px 40px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(33,150,243,0.35);
      position: relative;
      z-index: 2;
      animation: aparecer 1s ease;
    }

    @keyframes aparecer {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 26px;
      margin-bottom: 18px;
      color: #0d47a1;
    }

    .botones {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      width: 130px;
      font-weight: 600;
    }

    #si {
      background: linear-gradient(135deg, #2196f3, #1976d2);
      color: white;
      box-shadow: 0 8px 18px rgba(33,150,243,0.5);
      transition: transform 0.3s;
    }

    #no {
      background: #e3f2fd;
      color: #0d47a1;
      box-shadow: inset 0 0 0 2px #bbdefb;
    }

    #mensaje {
      margin-top: 22px;
      min-height: 30px;
      font-size: 16px;
      color: #1565c0;
      font-weight: 600;
      animation: fade 0.5s ease;
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Corazones */
    .heart {
      position: absolute;
      color: #2196f3;
      animation: flotar linear infinite;
      opacity: 0.85;
      pointer-events: none;
    }

    @keyframes flotar {
      0% {
        transform: translateY(0) scale(0.8);
        opacity: 0;
      }
      10% { opacity: 0.9; }
      100% {
        transform: translateY(-110vh) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¿Me perdonas? 💙</h1>

    <div class="botones">
      <button id="si" onclick="aceptar()">Sí</button>
      <button id="no" onclick="rechazar()">No</button>
    </div>

    <div id="mensaje"></div>
  </div>

  <script>
    let tamaño = 1;
    let intentos = 0;

    const mensajes = [
      "¿Segura que no? 💙",
      "El sí se está esforzando 😅",
      "Míralo crecer solo para ti 🥺",
      "Ya casi ocupa todo 🫣",
      "te amoooo 💙"
    ];

    function rechazar() {
      tamaño += 0.25;
      intentos++;

      const botonSi = document.getElementById("si");
      botonSi.style.transform = "scale(" + tamaño + ")";

      document.getElementById("mensaje").textContent =
        mensajes[Math.min(intentos - 1, mensajes.length - 1)];
    }

    function aceptar() {
      document.body.innerHTML = `
        <div style="
          background:radial-gradient(circle at top,#2196f3,#0d47a1);
          color:white;
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          text-align:center;
          font-family:Poppins,sans-serif;
          padding:25px;
        ">
          <div style="max-width:500px; animation: aparecer 1s ease;">
            <h1>💙 Sabía que dirías que sí 💙</h1>
            <p style="font-size:18px; line-height:1.6; margin-top:20px;">
              Sé que no soy perfecto, pero sí honesto con lo que siento y con lo que hago.
              Prefiero reconocer cuando me equivoco y mejorar, antes que esconderme detrás
              de excusas. Quiero que de mí esperes a alguien que siempre busque ser mejor,
              por ti y por nosotros.
              <br><br>
              <strong>Eres la mujer de mi vida, hoy, mañana y siempre.</strong>
            </p>
          </div>
        </div>
      `;
    }

    function crearCorazon() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💙";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 24) + "px";
      heart.style.animationDuration = (4 + Math.random() * 5) + "s";

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 8000);
    }

    setInterval(crearCorazon, 450);
  </script>

</body>
</html>
